name: Live FPM lab

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: ${{ matrix.suite }} on PHP ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # RCE chain (needs php_session_cancel_decode: PHP >= 8.2)
          - { version: "8.2.34", suite: FpmLabIntegrationTests }
          - { version: "8.3.35", suite: FpmLabIntegrationTests }
          - { version: "8.4.0", suite: FpmLabIntegrationTests }
          - { version: "8.4.25", suite: FpmLabIntegrationTests }
          - { version: "8.4.26", suite: FpmLabIntegrationTests }
          # session-file plant (works on every upload_progress build)
          - { version: "7.4.33", suite: FpmLabPoisonTests }
          - { version: "5.6.40", suite: FpmLabPoisonTests }
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl tar libxml2-dev

      - name: Build nginx
        run: lab/fpm/build_nginx.sh

      - name: Build PHP ${{ matrix.version }}
        run: lab/fpm/build_php.sh ${{ matrix.version }}

      - name: Start lab
        run: python3 tools/php2shell_fpm_labs.py up --only ${{ matrix.version }}

      - name: Enable ptrace for the oracle test
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Run live tests
        env:
          PHP2SHELL_FPM_LAB: "1"
          PHP2SHELL_FPM_VERSION: ${{ matrix.version }}
        run: python3 -m unittest tests.test_fpm.${{ matrix.suite }} -v

      - name: Stop lab
        if: always()
        run: python3 tools/php2shell_fpm_labs.py down
