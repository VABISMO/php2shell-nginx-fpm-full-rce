name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Lint
        run: ruff check tools tests

      - name: Compile Python
        run: python -m compileall -q tools tests

      - name: Check shell syntax
        run: bash -n lab/fpm/build_php.sh lab/fpm/build_nginx.sh

      - name: Unit tests and profile validation
        run: python -m unittest discover -s tests -v

      - name: Validate profiles against schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path("profiles/schema.json").read_text())
          for path in sorted(Path("profiles").glob("*-fpm.json")):
              jsonschema.validate(json.loads(path.read_text()), schema)
              print(f"{path}: valid")
          PY
